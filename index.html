<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASA 지구 근접 소행성 조회 서비스</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }


        h1 {
            color: #58a6ff;
            margin-bottom: 20px;
        }


        .search-box {
            background-color: #161b22;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 30px;
        }


        label {
            font-weight: bold;
        }


        input[type="date"] {
            padding: 8px 12px;
            border-radius: 5px;
            border: 1px solid #30363d;
            background-color: #0d1117;
            color: #fff;
            font-size: 16px;
        }


        button {
            padding: 9px 20px;
            background-color: #238636;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }


        button:hover {
            background-color: #2ea043;
        }


        .loading {
            display: none;
            font-size: 18px;
            color: #8b949e;
            margin: 20px;
        }


        .asteroid-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }


        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            transition: transform 0.2s;
        }


        .card:hover {
            transform: translateY(-5px);
        }


        .card.hazard {
            border-color: #f85149;
            background-color: #1c1213;
        }


        .card h3 {
            margin-top: 0;
            color: #58a6ff;
        }


        .card.hazard h3 {
            color: #f85149;
        }


        .badge {
            display: inline-block;
            padding: 3px 8px;
            font-size: 12px;
            border-radius: 12px;
            font-weight: bold;
            margin-bottom: 10px;
        }


        .badge.safe {
            background-color: #238636;
            color: white;
        }


        .badge.danger {
            background-color: #da3633;
            color: white;
        }


        .info-item {
            margin: 8px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>


    <h1>🚀 NASA 지구 근접 소행성 조회</h1>


    <div class="search-box">
        <label for="search-date">날짜 선택:</label>
        <input type="date" id="search-date">
        <button onclick="fetchAsteroids()">조회하기</button>
    </div>


    <div id="loading" class="loading">데이터를 불러오는 중입니다... 🛰️</div>


    <div id="result-container" class="asteroid-grid"></div>


    <script>
        const API_KEY = 'oeJwcWDyvgq3HnSrhsR8gO2IQ5ymTcG01qKZoW4Z';


        // 페이지 로드 시 오늘 날짜를 기본값으로 설정
        document.addEventListener("DOMContentLoaded", () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('search-date').value = today;
            fetchAsteroids(); // 초기 로딩 시 오늘 날짜 데이터 조회
        });


        async function fetchAsteroids() {
            const selectedDate = document.getElementById('search-date').value;
            if (!selectedDate) {
                alert('날짜를 선택해 주세요.');
                return;
            }


            const loadingEl = document.getElementById('loading');
            const containerEl = document.getElementById('result-container');


            loadingEl.style.display = 'block';
            containerEl.innerHTML = '';


            // NeoWs Feed API 호출 (start_date와 end_date를 동일하게 설정하여 해당 날짜만 조회)
            const url = `https://api.nasa.gov/neo/rest/v1/feed?start_date=${selectedDate}&end_date=${selectedDate}&api_key=${API_KEY}`;


            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`오류 발생: ${response.status}`);
                }
                const data = await response.json();
                
                const asteroids = data.near_earth_objects[selectedDate];
                displayAsteroids(asteroids);
            } catch (error) {
                console.error(error);
                containerEl.innerHTML = `<p style="color: #f85149;">데이터를 가져오는 중 오류가 발생했습니다.</p>`;
            } finally {
                loadingEl.style.display = 'none';
            }
        }


        function displayAsteroids(asteroids) {
            const containerEl = document.getElementById('result-container');


            if (!asteroids || asteroids.length === 0) {
                containerEl.innerHTML = '<p>해당 날짜에 발견된 지구 근접 소행성이 없습니다.</p>';
                return;
            }


            asteroids.forEach(asteroid => {
                const isHazardous = asteroid.is_potentially_hazardous_asteroid;
                const closeApproachData = asteroid.close_approach_data[0];


                // 지름 계산 (미터 단위 평균값)
                const minDiameter = asteroid.estimated_diameter.meters.estimated_diameter_min.toFixed(1);
                const maxDiameter = asteroid.estimated_diameter.meters.estimated_diameter_max.toFixed(1);


                // 지구 접근 거리 및 속도
                const missDistanceKm = Math.round(closeApproachData.miss_distance.kilometers).toLocaleString();
                const velocityKmH = Math.round(closeApproachData.relative_velocity.kilometers_per_hour).toLocaleString();


                const card = document.createElement('div');
                card.className = `card ${isHazardous ? 'hazard' : ''}`;


                card.innerHTML = `
                    <span class="badge ${isHazardous ? 'danger' : 'safe'}">
                        ${isHazardous ? '⚠️ 잠재적 위협 소행성' : '✅ 안전함'}
                    </span>
                    <h3>${asteroid.name}</h3>
                    <div class="info-item"><strong>추정 크기(지름):</strong> ${minDiameter}m ~ ${maxDiameter}m</div>
                    <div class="info-item"><strong>지구 최단 거리:</strong> 약 ${missDistanceKm} km</div>
                    <div class="info-item"><strong>이동 속도:</strong> 시속 ${velocityKmH} km/h</div>
                `;


                containerEl.appendChild(card);
            });
        }
    </script>
</body>
</html>
